name: guerra-naval

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: prod
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: prod
    ports:
      - "8080:80"

volumes:
  mysql:
